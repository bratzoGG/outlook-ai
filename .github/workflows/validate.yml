name: validate

on:
  push:
  pull_request:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar sintaxis de los scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Host "::error file=$($_.Name)::$($errors[0].Message)"
              $failed = $true
            } else {
              Write-Host "OK $($_.Name)"
            }
          }
          if ($failed) { exit 1 }
      - name: Comprobar codificación UTF-8 con BOM en los .ps1
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            if (-not $hasBom) {
              Write-Host "::error file=$($_.Name)::Falta el BOM UTF-8 (Windows PowerShell 5.1 leería mal los acentos)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
